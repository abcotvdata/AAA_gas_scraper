# This workflow pulls AAA metro gas price data

on:
  schedule:
    - cron: '5 12 * * *'

  workflow_dispatch:

name: scrape AAA gas prices

jobs:
  render:
    name: Gather latest gas data
    runs-on: macos-latest
    environment: .env
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Set up pandoc for Rmd docs
        uses: r-lib/actions/setup-pandoc@v2
      - name: Install dependencies and packages
        run: Rscript -e 'install.packages(c("rvest", "httr","dplyr","readr","purrr"))'
      - name: pull data, export files
        run: Rscript AAA_scraper.R
      - name: Commit results
        run: |
          git add -A
          git commit -m 'New gas data' || echo "No changes"
          git push origin || echo "No changes to commit"
